<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TakeoffSEO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1a2b'/%3E%3Cpath d='M8 22 L22 8 M14 8 h8 v8' stroke='%23c9843a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--paper:#fffdf8;--paper-2:#f6f0e4;--paper-3:#efe6d6;--ink:#0b1a2b;--ink-2:#3d3830;--ink-3:#6b645a;--line:#e6dcc9;--line-2:#d2c4ae;--accent:#9a5f2c;--accent-2:#c9843a;--accent-soft:#f8ecdc;--ok:#1a6a48;--ok-soft:#e6f2ea;--warn:#b7791f;--warn-soft:#fdf3dc;--bad:#a83a2a;--bad-soft:#fbe7e3;--serif:"IBM Plex Serif",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper-2)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0 0 .4em;line-height:1.2}
h1{font-size:1.7rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em}
.app{display:grid;min-height:100vh;grid-template-columns:1fr}
@media(min-width:900px){.app{grid-template-columns:230px 1fr}}
.side{background:var(--ink);color:#e8dcc8;padding:18px 14px;display:none;flex-direction:column;gap:4px}
@media(min-width:900px){.side{display:flex;position:sticky;top:0;height:100vh}}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--serif);font-weight:600;font-size:1.15rem;text-decoration:none;padding:6px 8px 18px}
.brand svg{width:26px;height:26px}
.side a.nav{color:#e8dcc8;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.side a.nav:hover{background:#16324c;color:#fff}
.side a.nav.active{background:#16324c;color:#fff}
.side .cnt{background:#c9843a;color:#fff;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px}
.side .cnt.red{background:var(--bad)}
.side .foot{margin-top:auto;font-size:.78rem;color:#9a8f7c;padding:12px 8px 0;border-top:1px solid #1c2c3f}
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:sticky;top:0;z-index:20}
@media(min-width:900px){.topbar{display:none}}
.topbar select{background:#16324c;color:#fff;border:1px solid #3a4a5c;border-radius:8px;padding:8px 10px;font:inherit}
.app>div{min-width:0}
main{padding:20px 16px 60px;max-width:1240px;width:100%;min-width:0}
@media(min-width:900px){main{padding:28px 32px 80px}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.head p{color:var(--ink-3);margin:0}
.banner{background:var(--warn-soft);border:1px solid #ecd9a8;border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin-top:0}
.grid{display:grid;gap:14px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.kpi .s{font-size:.85rem;color:var(--ink-2);margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1.5px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#7f4c20}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--ink);background:#fff}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent;padding-left:4px;padding-right:4px}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line-2);border-radius:8px;font:inherit;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-2);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.f{margin-bottom:12px}
.f2{display:grid;gap:12px}
@media(min-width:600px){.f2{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:#fdfaf3}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper-3);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}.tag.sample{background:#e9eef5;color:#3b5878}
.muted{color:var(--ink-3)}.small{font-size:.85rem}
.empty{color:var(--ink-3);padding:18px;text-align:center;border:1.5px dashed var(--line-2);border-radius:10px;background:transparent}
/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--paper-3);border-radius:12px;padding:10px;min-height:300px}
.col h4{margin:4px 6px 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--accent-2)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;font-size:.9rem}
.kcard:active{cursor:grabbing}
.kcard b{display:block;font-weight:600}
.kcard .m{color:var(--ink-3);font-size:.8rem;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.kcard.late{border-color:var(--bad)}
/* checklist */
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk li:last-child{border-bottom:none}
.chk input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--accent)}
.chk .done{text-decoration:line-through;color:var(--ink-3)}
.bar{height:8px;background:var(--paper-3);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-2)}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line-2)}
.timeline li{padding:0 0 12px 16px;position:relative;font-size:.9rem}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent-2);border:2px solid var(--paper-2)}
.timeline .t{color:var(--ink-3);font-size:.78rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
pre.email{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;font-family:var(--sans);font-size:.92rem;margin:0 0 10px}
.alert{border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:#7a5210}
.alert a{color:inherit;font-weight:600}
dialog{border:none;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(11,26,43,.5)}
dialog .in{padding:22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.hint{font-size:.82rem;color:var(--ink-3);margin-top:4px}
.stage-select{max-width:220px}
.back{font-size:.85rem;color:var(--ink-3);text-decoration:none;display:inline-block;margin-bottom:8px}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div>
    <div class="topbar">
      <a class="brand" href="#/dashboard" style="padding:0"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#16324c"/><path d="M8 22 L22 8 M14 8 h8 v8" stroke="#c9843a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Admin</a>
      <select id="mobileNav" aria-label="Go to"></select>
    </div>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ---------------- constants ---------------- */
const STAGES = [
  ['new','New lead'],['check','Check sent'],['follow','Following up'],['booked','Booked'],['active','Active'],['delivered','Delivered'],['monthly','Monthly'],['dormant','Dormant'],['lost','Lost']
];
const STAGE_NAME = Object.fromEntries(STAGES);
const PKG = {
  tune:{name:'Profile Tune-Up',price:490,hours:6,buffer:3,pay:'full',items:[
    'Baseline captured: profile screenshot, categories, review count, Insights (calls, clicks, directions, last 28 days)',
    'Primary category set to the most profitable job; secondary categories added for every other service',
    'Every service added with a one-sentence description in customer words',
    'Service area set to where they actually work; address hidden if service-area business',
    'Hours set, including known public holidays',
    'Business description written (750 chars max), no keyword stuffing',
    'Phone, website, quote/booking links checked and matching the site exactly',
    '10+ real photos named and uploaded; logo and cover set; stock or irrelevant photos removed',
    '5–8 common questions asked and answered from the owner account',
    'Duplicate listings searched; flagged for removal or merged; ticket recorded',
    'Name, address, phone identical on 10 directories (Apple Maps, Bing, Yellow Pages, True Local, Yelp, Hotfrog, Localsearch, Facebook, industry directory, +1)',
    'Review-request link created and text template written in client voice; sent with how-to',
    'Tracking: Insights baseline saved; GA4 call-click event if site exists',
    'Quality check (SOP-16) on the profile, read as a customer',
    'Handover note written (what changed, keep doing, what next)',
    '20-minute handover call done'
  ]},
  fix:{name:'Website Fix-Up',price:1900,hours:20,buffer:5,pay:'half',items:[
    'Everything in Profile Tune-Up (run that checklist too)',
    'Baseline: Search Console clicks/impressions (3 months), GA4 enquiries, page list, PageSpeed mobile score, phone screenshots',
    'Competitor look: 2–3 businesses appearing where client doesn\'t; two lines each',
    'The 20 searches that matter written and grouped by service',
    'One-page plan sent (T-plan) and signed off by client before any change',
    'Technical fixes done and logged: mobile layout, image compression, broken links, unreachable pages, thin/duplicate pages, HTTPS, titles/descriptions, one H1 per page',
    'Service page 1 written, approved by client',
    'Service page 2 written, approved',
    'Service page 3 written, approved',
    'Service page 4 written, approved',
    'Service page 5 written, approved',
    'Area page 1 written (real suburbs, real jobs), approved',
    'Area page 2 written, approved',
    'Homepage: first line says what and where; services linked; phone visible on a phone without scrolling',
    'Tap-to-call on every page; short form tested end to end',
    'Tracking: GA4 events for call clicks, form submits, quote clicks; Search Console verified; data arriving',
    'Google profile matched to the site: service names, areas, links to right pages',
    'Quality check (SOP-16) on every page, on a phone',
    'Before-and-after report written and sent (T9) with what-next note',
    '30-minute handover call done'
  ]},
  site:{name:'New Website',price:3900,hours:40,buffer:10,pay:'half',items:[
    'Everything in Profile Tune-Up (run that checklist too)',
    'Baseline: old URLs exported, Search Console data, pages with traffic (or note "no site")',
    'Jobs conversation done (30–45 min) and recorded in the questions sheet',
    'The 20 searches that matter written and grouped',
    'Site plan (one page): every page, purpose, title, content; platform and hosting cost stated; signed off',
    'Domain and hosting in client\'s name, client\'s card; DNS access confirmed',
    'Build shell: theme, one accent colour, logo/colours, readable fonts, header phone, footer ABN and areas',
    'Pages written and built (up to 8), each approved by client (two rounds included)',
    'Photos chosen, cropped, compressed, named, alt text written',
    'Forms tested end to end: submits, emails client, thank-you shows',
    'Tracking: GA4 with call/form/quote events; Search Console verified',
    'Redirects: every old URL mapped and tested; no 404s for anything with traffic',
    'Launch checklist: HTTPS, mobile, speed, titles/descriptions, sitemap, robots, favicon, 404 page, privacy page with ABN',
    'Google profile linked to new pages; services and areas matched',
    'Quality check (SOP-16) on every page, on a phone, on the live domain',
    '20-minute how-to-edit video recorded and sent',
    'Launch report sent (T9); final invoice on go-live',
    '30-day fix window task set'
  ]},
  monthly:{name:'Monthly Plan',price:690,hours:4,buffer:0,pay:'monthly',items:[]}
};
const MONTHLY_ITEMS = {
  steady:['Last month\'s numbers reviewed; two lines written','This month\'s list sent (T11) and agreed','1 page written or improved, approved','Profile: 2 posts, new photos, questions answered, hours checked','Every new review replied to (drafted/approved)','3 of 10 directories spot-checked','Search Console errors, broken links, speed checked; small fixes done','Friday updates sent each week','One-page report sent (T12)'],
  growth:['Last month\'s numbers reviewed; two lines written','This month\'s list sent (T11) and agreed','Page 1 written or improved, approved','Page 2 written or improved, approved','Page 3 written or improved, approved','Profiles (up to 3): 2 posts each, photos, Q&A, hours','Every new review replied to','3 of 10 directories spot-checked','Search Console, links, speed checked; fixes done','Competitor watch: who moved on the 20 searches and why','Friday updates sent each week','One-page report sent (T12)','30-minute call held']
};
const MONTHLY_PRICE = {steady:690, growth:1190};
const MONTHLY_HOURS = {steady:4, growth:8};
const SOURCES = ['Website: free check','Website: package form','Website: contact','Own Google profile','Referral: client','Referral: partner','Local group','Outreach','Phone','In person','Other'];
const GBP_GAPS = ['Only one category','Services not listed or incomplete','Service area wrong or missing','Hours missing or wrong','No/weak description','Fewer than 10 photos or stock photos','No Q&A','Fewer than 10 reviews','No recent reviews (90 days)','Reviews not replied to','Duplicate listing found','Name or phone doesn\'t match website','Website link missing or wrong'];

const TEMPLATES = [
 {id:'T1',name:'Auto-reply (instant)',subject:'Got your free check request, {first}',body:`Thanks {first}. I've got your details for {business}.\n\nI'll search for you the way a customer would, on Google, Google Maps and one AI tool, and email you one page within two business days: where you show up, what's missing, and the three things I'd fix first.\n\nNo call needed. If I have a question first, I'll email.\n\nAlex\nTakeoffSEO · 0497 878 930`},
 {id:'T3',name:'7-day follow-up',subject:'Re: Your free check: {business}',body:`Hi {first}, did the check make sense? Anything in it you'd like me to explain? Alex`},
 {id:'T4',name:'30-day nudge',subject:'Re: Your free check: {business}',body:`Hi {first},\n\nOne thing I noticed since: [specific useful observation].\n\nIf you'd like the {rec} done, it's {recprice} and the full list of what's included is at takeoffseo.com/{recslug}. If not, no worries at all.\n\nAlex`},
 {id:'T5',name:'Quarterly check-in',subject:'Still here',body:`Hi {first}, still here if you ever want that {rec} done. Prices are the same and on the site. No pressure. Alex`},
 {id:'T6',name:'Booking confirmation + invoice',subject:'{pkg} for {business}: agreement, invoice and finish date',body:`Hi {first},\n\nThanks for booking the {pkg}. Here's everything in one place.\n\nWhat you get: the full list at takeoffseo.com/{pkgslug}. That list is the job. When it's all ticked, it's done.\nPrice: {price} plus GST. {payterms}.\nFinish date: {finish}. If I miss it for reasons on my side, the second half isn't due until the list is done. If I'm waiting on access or photos from you, the date moves by the same amount and I'll tell you.\nAgreement: attached, one page.\nInvoice: attached, due in 7 days.\n\nOnce it's paid I'll send what I need from you, and we start.\n\nAlex\nTakeoffSEO · 0497 878 930`},
 {id:'T7',name:'Onboarding (payment received)',subject:'Payment received. Here\'s what I need to start on {business}',body:`Hi {first},\n\nThanks, payment's in. Finish date is {finish}. Here's what I need, in order of urgency:\n\n1. Google Business Profile access. Add hello@takeoffseo.com as a Manager. Takes two minutes. If you've never claimed your profile, tell me and we'll do it on a 10-minute call.\n2. Website login (an editor account for hello@takeoffseo.com, rather than your own password).\n3. Analytics: add me as a user if you have Google Analytics. If not, I'll set it up.\n4. Photos: real ones of jobs, team, vehicles, premises. Phone photos are fine.\n5. Ten questions about your work (attached). Rough answers are perfect.\n\nOnce I've got these, I start. You'll get a short email every Friday saying what got done.\n\nAlex`},
 {id:'T8',name:'Friday update',subject:'{business}: this week',body:`Hi {first},\n\nDone this week: {done}\nNext week: {next}\nNeed from you: nothing\nFinish date: {finish}, on track\n\nAlex`},
 {id:'T9',name:'Delivered + report',subject:'{business}: done. Report attached',body:`Hi {first},\n\nEvery item on the list is done. The one-page report is attached: what we set out to do, what got done, what's changed so far, and what I'd do next.\n\nFinal invoice attached, due in 7 days.\n\nI've booked our handover for [time]. If that doesn't suit, pick another: [booking link].\n\nThanks for trusting me with it.\n\nAlex`},
 {id:'T10',name:'Review, permission, referral ask',subject:'Three small favours (all optional)',body:`Hi {first},\n\nGlad the {pkg} went well. Three small things, only if you're happy to:\n\n1. A Google review. It's how I get found, same as you. Two lines about what got done is perfect: [review link]\n2. Your name on my site. Just "{business}, {pkg}, [month]". No quotes, no numbers. Reply yes or no.\n3. Anyone you know who's invisible on Google? I'd be glad to do their free check.\n\nWhatever you do or don't do, thanks again.\n\nAlex`},
 {id:'T11',name:'Monthly list (1st)',subject:'{business}: this month\'s list',body:`Hi {first},\n\nLast month in two lines: [what moved, what didn't].\n\nThis month I'll do:\n1. [page]\n2. [profile updates]\n3. [item based on last month's numbers]\n\nReply "yes" or change anything. If I don't hear back in three days I'll get started. Invoice attached.\n\nAlex`},
 {id:'T13',name:'What next (14 days after delivery)',subject:'{business}: what next, if anything',body:`Hi {first},\n\nTwo weeks on from the {pkg}. Three options, no wrong answer:\n\n1. Keep going monthly. Steady $690 or Growth $1,190 a month, month to month: takeoffseo.com/monthly\n2. Do it yourself. Keep doing the three things in the handover note.\n3. Nothing for now. Come back whenever.\n\nMy honest view for {business}: [one sentence].\n\nAlex`},
 {id:'T14',name:'Late invoice (day 10)',subject:'Re: Invoice [number]',body:`Hi {first}, just checking this one didn't get lost: invoice [number] for [amount] was due [date]. Attached again. If anything about the work isn't right, tell me first and we'll sort that. Alex`},
 {id:'T15',name:'Not a fit',subject:'Re: your free check request',body:`Hi {first},\n\nThanks for getting in touch. I'm going to be straight: [reason]. I'd be taking your money for something I'm not the best person for.\n\nIf your situation changes, the free check is always there.\n\nAlex`}
];

/* ---------------- state ---------------- */
const KEY='takeoffseo-admin-v1';
let S;
function defaults(){return {settings:{capacity:25,owner:'Alexander Nott',email:'hello@takeoffseo.com',phone:'0497 878 930'},contacts:[],tasks:[],activities:[],jobs:[],checks:[],seq:1}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.contacts)return s;}catch(e){}const d=defaults();seed(d);return d;}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function uid(){return 'id'+(S.seq++)}
const today=()=>new Date().toISOString().slice(0,10);
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function addBiz(d,n){let x=new Date(d),c=0;while(c<n){x.setDate(x.getDate()+1);if(x.getDay()!==0&&x.getDay()!==6)c++;}return x.toISOString().slice(0,10)}
function bizDaysBetween(a,b){let x=new Date(a),c=0;while(x.toISOString().slice(0,10)<b){x.setDate(x.getDate()+1);if(x.getDay()!==0&&x.getDay()!==6)c++;}return c}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function fmtD(d){if(!d)return '—';const x=new Date(d);return x.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}
function money(n){return '$'+Number(n).toLocaleString('en-AU')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function first(c){return (c.name||'there').split(' ')[0]}
const monthKey=(d)=>d.slice(0,7);

/* ---------------- core actions (the automations) ---------------- */
function act(cid,text,type='note'){S.activities.push({id:uid(),cid,at:new Date().toISOString(),type,text})}
function task(cid,title,due,type='task'){S.tasks.push({id:uid(),cid,title,due,type,done:false})}
function setStage(c,stage,why){if(c.stage===stage)return;c.stage=stage;c.stageAt=today();act(c.id,`Stage → ${STAGE_NAME[stage]}${why?' · '+why:''}`,'stage')}
function contact(id){return S.contacts.find(c=>c.id===id)}

function newLead(data,opts={}){
  const c={id:uid(),name:data.name||'',email:data.email||'',phone:data.phone||'',business:data.business||'',website:data.website||'',area:data.area||'',jobs:data.jobs||'',source:data.source||'Website: free check',stage:'new',createdAt:today(),stageAt:today(),rec:'',sample:!!opts.sample,notes:''};
  S.contacts.push(c);
  act(c.id,`Lead created · source: ${c.source}`,'system');
  if(c.source.startsWith('Website')){act(c.id,'Auto-reply T1 sent by system','email')}
  task(c.id,'Free check due',addBiz(c.createdAt,2),'check');
  if(data.pkg){ act(c.id,`Booked ${PKG[data.pkg].name} from website form`,'system'); bookPackage(c,data.pkg,data.plan||'steady',{silent:true}); }
  save();return c;
}
function markCheckSent(c){
  setStage(c,'check','free check emailed (T2)');
  act(c.id,'Free check email T2 sent','email');
  S.tasks.filter(t=>t.cid===c.id&&t.type==='check'&&!t.done).forEach(t=>{t.done=true;t.doneAt=today()});
  task(c.id,'Follow up: did the check make sense? (T3)',addDays(today(),7),'follow');
  save();
}
function completeTask(t){
  t.done=true;t.doneAt=today();const c=contact(t.cid);if(!c){save();return}
  if(t.type==='follow'){setStage(c,'follow','7-day follow-up sent');act(c.id,'Follow-up T3 sent','email');task(c.id,'30-day nudge (T4)',addDays(today(),30),'nudge')}
  else if(t.type==='nudge'){setStage(c,'dormant','no reply after 30-day nudge');act(c.id,'Nudge T4 sent','email');task(c.id,'Quarterly check-in (T5)',addDays(today(),90),'quarter')}
  else if(t.type==='quarter'){act(c.id,'Quarterly check-in T5 sent','email');task(c.id,'Quarterly check-in (T5)',addDays(today(),90),'quarter')}
  else if(t.type==='check'){ /* handled by builder */ }
  else if(t.type==='review'){act(c.id,'Review/permission/referral ask T10 sent','email')}
  else if(t.type==='whatnext'){act(c.id,'What-next T13 sent','email');if(c.stage==='delivered')setStage(c,'dormant','no next step after 14 days')}
  else{act(c.id,`Task done: ${t.title}`,'task')}
  save();
}
function finishDateFor(pkg){
  const committed=hoursCommitted();
  const weeks=Math.max(0,Math.ceil((committed+PKG[pkg].hours)/Math.max(1,S.settings.capacity))-1);
  let d=addBiz(today(),5); d=addDays(d,weeks*7); d=addBiz(d,PKG[pkg].buffer);
  const x=new Date(d);while(x.getDay()!==5)x.setDate(x.getDate()+1);return x.toISOString().slice(0,10);
}
function bookPackage(c,pkg,plan,opts={}){
  const j={id:uid(),cid:c.id,pkg,plan:pkg==='monthly'?plan:null,status:'booked',createdAt:today(),finish:pkg==='monthly'?null:finishDateFor(pkg),items:PKG[pkg].items.map(t=>({t,done:false})),invoices:[],fridays:[],cycles:[]};
  const price=pkg==='monthly'?MONTHLY_PRICE[plan]:PKG[pkg].price;
  if(pkg==='monthly'){j.invoices.push({id:uid(),label:`${plan==='growth'?'Growth':'Steady'} · ${monthKey(today())}`,amount:price,sent:today(),due:addDays(today(),7),paid:null})}
  else if(PKG[pkg].pay==='full'){j.invoices.push({id:uid(),label:'In full',amount:price,sent:today(),due:addDays(today(),7),paid:null})}
  else{j.invoices.push({id:uid(),label:'Deposit (50%)',amount:price/2,sent:today(),due:addDays(today(),7),paid:null});j.invoices.push({id:uid(),label:pkg==='site'?'Final (at go-live)':'Final (list done)',amount:price/2,sent:null,due:null,paid:null})}
  S.jobs.push(j);
  setStage(c,'booked',`${PKG[pkg].name} booked`);
  act(c.id,`Booking confirmation T6 + agreement + invoice sent · ${PKG[pkg].name}${j.finish?' · finish '+fmtD(j.finish):''}`,'email');
  S.tasks.filter(t=>t.cid===c.id&&!t.done&&['check','follow','nudge','quarter'].includes(t.type)).forEach(t=>{t.done=true;t.doneAt=today()});
  task(c.id,`Chase deposit if unpaid: ${PKG[pkg].name}`,addBiz(today(),5),'task');
  if(!opts.silent)save();
  return j;
}
function markInvoicePaid(j,inv){
  inv.paid=today();const c=contact(j.cid);
  act(c.id,`Invoice paid: ${inv.label} ${money(inv.amount)}`,'money');
  if(j.status==='booked'){j.status='active';j.startedAt=today();setStage(c,j.pkg==='monthly'?'monthly':'active','payment received');act(c.id,'Onboarding email T7 sent','email');task(c.id,'Onboarding: access, photos, questions received',addBiz(today(),5),'task');S.tasks.filter(t=>t.cid===c.id&&!t.done&&t.title.startsWith('Chase deposit')).forEach(t=>{t.done=true;t.doneAt=today()});if(j.pkg==='monthly')ensureCycle(j)}
  save();
}
function toggleItem(j,i){
  j.items[i].done=!j.items[i].done;
  if(j.items.length&&j.items.every(x=>x.done)&&!j.allDoneAt){j.allDoneAt=today();const c=contact(j.cid);act(c.id,'Every item ticked. Tasks created: report, final invoice','system');task(c.id,`Send report + T9 · ${PKG[j.pkg].name}`,addBiz(today(),2),'report');if(j.invoices[1]){j.invoices[1].sent=today();j.invoices[1].due=addDays(today(),7);act(c.id,`Final invoice sent ${money(j.invoices[1].amount)}`,'money')}}
  save();
}
function markDelivered(j){
  j.status='delivered';j.deliveredAt=today();const c=contact(j.cid);
  setStage(c,'delivered','report sent');act(c.id,'Report + T9 sent','email');
  S.tasks.filter(t=>t.cid===c.id&&!t.done&&t.type==='report').forEach(t=>{t.done=true;t.doneAt=today()});
  task(c.id,'Ask for review, permission, referral (T10)',addDays(today(),7),'review');
  task(c.id,'What next: monthly, yourself, nothing (T13)',addDays(today(),14),'whatnext');
  if(j.pkg==='site')task(c.id,'Close 30-day fix window; check in',addDays(today(),30),'task');
  save();
}
function ensureCycle(j){
  const m=monthKey(today());
  if(!j.cycles.find(cy=>cy.month===m)){j.cycles.push({month:m,items:MONTHLY_ITEMS[j.plan].map(t=>({t,done:false})),numbers:{},reportSent:null});
    const c=contact(j.cid);act(c.id,`Monthly cycle ${m} created by system`,'system');
    if(!S.tasks.find(t=>t.cid===j.cid&&t.title.includes(`month's list`)&&t.due.startsWith(m)))task(j.cid,`Send this month's list (T11) · ${m}`,addBiz(m+'-01',1),'task');
    if(!j.invoices.find(i=>i.label.endsWith(m)))j.invoices.push({id:uid(),label:`${j.plan==='growth'?'Growth':'Steady'} · ${m}`,amount:MONTHLY_PRICE[j.plan],sent:today(),due:addDays(today(),7),paid:null});
  }
}
function giveNotice(j){j.status='notice';j.noticeAt=today();const c=contact(j.cid);act(c.id,'Notice given. Finish the month properly, then handover (SOP-12)','system');task(c.id,'Handover note + remove access (SOP-12)',addDays(today(),30),'task');setStage(c,'dormant','monthly plan ended');save()}

function hoursCommitted(){
  let h=0;S.jobs.forEach(j=>{if(j.status==='active'||j.status==='booked'){if(j.pkg==='monthly')h+=MONTHLY_HOURS[j.plan];else{const left=j.items.filter(i=>!i.done).length/Math.max(1,j.items.length);h+=PKG[j.pkg].hours*left}}});return Math.round(h)}
function runAutomations(){
  S.jobs.filter(j=>j.pkg==='monthly'&&j.status==='active').forEach(ensureCycle);
  save();
}

/* ---------------- render helpers ---------------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(h){location.hash=h}
function openDlg(html){document.getElementById('dlgIn').innerHTML=html;document.getElementById('dlg').showModal()}
function closeDlg(){document.getElementById('dlg').close()}
function stageTag(s){const cls={new:'bad',check:'acc',follow:'warn',booked:'acc',active:'ok',delivered:'ok',monthly:'ok',dormant:'',lost:''}[s]||'';return `<span class="tag ${cls}">${STAGE_NAME[s]}</span>`}
function alerts(){
  const t=today(),out=[];
  S.contacts.filter(c=>c.stage==='new'&&bizDaysBetween(c.createdAt,t)>=2).forEach(c=>out.push(['bad',`Free check for <a href="#/contact/${c.id}">${esc(c.business)}</a> is past 2 business days`]));
  S.tasks.filter(x=>!x.done&&x.due<t).forEach(x=>{const c=contact(x.cid);out.push(['warn',`Overdue: ${esc(x.title)} · <a href="#/contact/${x.cid}">${esc(c?c.business:'')}</a>`])});
  S.jobs.filter(j=>j.status==='active'&&j.finish).forEach(j=>{const pct=j.items.filter(i=>i.done).length/j.items.length;if(daysBetween(t,j.finish)<=5&&pct<.8)out.push(['bad',`Finish date ${fmtD(j.finish)} at risk: <a href="#/job/${j.id}">${esc(contact(j.cid).business)} ${PKG[j.pkg].name}</a> is ${Math.round(pct*100)}% done (SOP-19: say so now)`])});
  S.jobs.forEach(j=>j.invoices.filter(i=>i.sent&&!i.paid&&i.due&&daysBetween(i.due,t)>=3).forEach(i=>out.push(['warn',`Invoice ${daysBetween(i.due,t)} days overdue: ${esc(contact(j.cid).business)} ${i.label} ${money(i.amount)} · <a href="#/job/${j.id}">send T14</a>`])));
  return out;
}

  return `<div class="head"><div><h1>Playbook</h1><p>The SOPs, and the checklists this app uses. Change the SOP first, then the checklist.</p></div></div>
  <div class="tabs">${[['sops','SOPs'],['tune','Tune-Up list'],['fix','Fix-Up list'],['site','New Website list'],['steady','Monthly Steady'],['growth','Monthly Growth'],['qa','QA (SOP-16)']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="window.__pb='${k}';render()">${n}</button>`).join('')}</div>
  ${tab==='sops'?`<div class="card"><table><tr><th>#</th><th>Procedure</th><th>File</th></tr>${sops.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td><a href="/docs-placeholder/${s[2]}" target="_blank">${s[2]}</a></td></tr>`).join('')}</table><p class="hint" style="margin-top:10px">Also: <a href="/docs-placeholder/README.md" target="_blank">README</a> · <a href="/docs-placeholder/07-templates.md" target="_blank">07-templates.md</a> · <a href="../FUNNEL.md" target="_blank">FUNNEL.md</a></p></div>`:
   tab==='qa'?`<div class="card"><h3>Ten-minute quality check, on a phone</h3><ol>${['Read it out loud. Anything you stumble on gets rewritten.','Does the first line say what and where?','Every fact right: name spelled as the client spells it, phone, suburbs, hours, prices, ABN?','Banned words gone? (unlock, elevate, leverage, cutting-edge, dominate, synergy, holistic, best-in-class, guaranteed, page one, "we pride ourselves")','Any claim you can\'t back? Remove.','Phone taps to call. Form submits and arrives. Links go where they say.','Photos real, fast, alt text.','Title and description set and unique.','Looks right on a phone: no tiny text, no sideways scroll, thumb-reachable button.','No "lorem", "TODO", "[placeholder]" or template default left.'].map(x=>`<li>${x}</li>`).join('')}</ol></div>`:
   `<div class="card"><h3>${tab in PKG?PKG[tab].name:'Monthly '+tab} checklist (${(tab in PKG?PKG[tab].items:MONTHLY_ITEMS[tab]).length} items)</h3><ol>${(tab in PKG?PKG[tab].items:MONTHLY_ITEMS[tab]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`}`;
 },
 settings(){
  const sc=S.contacts.filter(c=>c.sample).length;
  return `<div class="head"><div><h1>Settings</h1><p>Saved in this browser. Export monthly to the business drive (SOP-17).</p></div></div>
  <div class="grid g2">
   <div class="card"><h3>Capacity and business</h3>
    <div class="f"><label>Billable hours a week (SOP-15)</label><input type="number" value="${S.settings.capacity}" onchange="S.settings.capacity=+this.value;save();toast('Saved')"></div>
    <div class="f"><label>Owner</label><input value="${esc(S.settings.owner)}" onchange="S.settings.owner=this.value;save()"></div>
    <div class="f2"><div class="f"><label>Email</label><input value="${esc(S.settings.email)}" onchange="S.settings.email=this.value;save()"></div><div class="f"><label>Phone</label><input value="${esc(S.settings.phone)}" onchange="S.settings.phone=this.value;save()"></div></div>
    <h3 style="margin-top:16px">Prices and hours (from the website)</h3>
    <table>${Object.entries(PKG).filter(([k])=>k!=='monthly').map(([k,p])=>`<tr><td>${p.name}</td><td>${money(p.price)}</td><td>${p.hours}h · +${p.buffer} days buffer</td></tr>`).join('')}<tr><td>Monthly Steady / Growth</td><td>$690 / $1,190</td><td>4h / 8h a month</td></tr><tr><td>Extra work</td><td>$150/hr</td><td>quoted first</td></tr></table>
    <p class="hint">Prices live in the SOPs and the website. Change them there first; this preview mirrors them.</p></div>
   <div class="card"><h3>Data</h3>
    <div class="row" style="margin-bottom:12px"><button class="btn sec" onclick="exportJSON()">Export JSON</button><label class="btn sec" style="margin:0">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importJSON(this)"></label></div>
    <p class="small">${sc} sample contact${sc===1?'':'s'} loaded so you can click around. Their names are obviously made up. Clear them when you start using this for real.</p>
    <div class="row"><button class="btn danger" ${sc?'':'disabled'} onclick="if(confirm('Remove all sample data?')){clearSample();render();toast('Sample data cleared')}">Clear sample data</button><button class="btn sec" onclick="if(confirm('Reset everything and reload the samples?')){localStorage.removeItem('${KEY}');location.reload()}">Reset to samples</button></div>
    <h3 style="margin-top:20px">What this is</h3><p class="small">A working preview of the TakeoffSEO admin described in <a href="../FUNNEL.md" target="_blank">FUNNEL.md</a>. In Stage 2 the same screens become <code>/admin</code> on the real site with a database, so website forms land here automatically and the emails send themselves. Until then it works offline in this browser.</p></div>
  </div>`;
 }
};

/* ---------------- text generators ---------------- */
function chk(id){return S.checks.find(x=>x.id===id)}
function toggleGap(id,g){const k=chk(id);const i=k.gaps.indexOf(g);if(i>=0)k.gaps.splice(i,1);else k.gaps.push(g);save()}
function checkEmail(c,k){
  const s=k.searches.filter(x=>x.q).map(x=>`"${x.q}" — Google: ${x.g||'?'} · Maps: ${x.m||'?'}`).join('\n');
  const rec=k.rec==='none'?`Honestly, you're in good shape. Keep asking for reviews and I'd leave it for now.`:k.rec?`${PKG[k.rec].name}, ${money(k.rec==='monthly'?690:PKG[k.rec].price)}${k.rec==='monthly'?' a month':''} plus GST. ${k.recWhy||''}\nDetails and the full list of work: takeoffseo.com/${slug(k.rec)}`:'[recommendation]';
  return `Subject: Your free check: ${c.business}\n\nHi ${first(c)},\n\nHere's where ${c.business} stands today. I searched the way a customer would.\n\nWHERE YOU SHOW UP NOW\n${s||'[five searches]'}\n${k.ai.q?`${k.ai.tool} asked "${k.ai.q}": ${k.ai.r||'?'}.${k.ai.named?' It named: '+k.ai.named+'.':''}`:''}\n\nYOUR GOOGLE PROFILE\n${k.gaps.length?k.gaps.map(g=>'- '+g).join('\n'):'- Looks complete. Good.'}\n${k.site?`\nYOUR WEBSITE\n${k.site}\n`:''}\nTHE THREE THINGS I'D FIX FIRST\n${k.fixes.map((f,i)=>`${i+1}. ${f||'[fix]'}`).join('\n')}\n\nWHAT I'D DO\n${rec}\n\nAnything unclear, reply and ask. Happy to explain any of it.\n\nAlex\nTakeoffSEO · 0497 878 930`;
}
function slug(k){return {tune:'tune-up',fix:'fix-up',site:'new-website',monthly:'monthly'}[k]||''}
function fill(t,c){
  const j=c?S.jobs.filter(x=>x.cid===c.id).slice(-1)[0]:null;const pkg=j?PKG[j.pkg]:null;const price=j?(j.pkg==='monthly'?MONTHLY_PRICE[j.plan]:pkg.price):0;
  const map={first:c?first(c):'[first name]',business:c?c.business:'[business]',pkg:pkg?pkg.name:'[package]',pkgslug:j?slug(j.pkg):'[package]',price:j?money(price):'[price]',payterms:pkg?(pkg.pay==='full'?'Paid before I start':pkg.pay==='half'?`${money(price/2)} to start, ${money(price/2)} when the list is done`:'Billed at the start of each month'):'[terms]',finish:j&&j.finish?fmtD(j.finish):'[finish date]',rec:c&&c.rec?PKG[c.rec].name:'[package]',recprice:c&&c.rec?money(c.rec==='monthly'?690:PKG[c.rec].price):'[price]',recslug:c&&c.rec?slug(c.rec):'[package]',done:'[items]',next:'[items]'};
  return t.replace(/\{(\w+)\}/g,(m,k)=>map[k]??m);
}
function monthlyReport(c,j,cy){
  const N=cy.numbers;const l=(k,label)=>`${label}: ${N[k]??'—'} (last month ${N[k+'_prev']??'—'})`;
  return `Subject: ${c.business}: ${cy.month} report\n\nHi ${first(c)},\n\nThe main thing this month: ${N.main||'[one sentence]'}.\n\n${l('calls','Calls from your Google profile')}\n${l('enq','Website enquiries')}\n${l('dir','Direction requests')}\nAppeared for ${N.vis??'—'} of the 20 searches that matter (last month ${N.vis_prev??'—'})\n${l('rev','New reviews')}\n\nWhat I did:\n${(N.did||cy.items.filter(i=>i.done).map(i=>i.t).join('\n')||'[list]').split('\n').map(x=>'- '+x).join('\n')}\n\nNext month:\n${(N.next||'[list]').split('\n').map(x=>'- '+x).join('\n')}\n\nNeed from you: nothing\n${j.plan==='growth'?'\nCall booked for [time].\n':''}\nAlex`;
}

/* ---------------- handlers ---------------- */
function render(){
  const h=location.hash.replace(/^#\/?/,'')||'dashboard';const [view,arg]=h.split('/');
  runAutomations();
  const fn=VIEWS[view]||VIEWS.dashboard;
  document.getElementById('main').innerHTML=fn(arg);
  const t=today();const late=S.tasks.filter(x=>!x.done&&x.due<t).length;const newLeads=S.contacts.filter(c=>c.stage==='new').length;
  const nav=[['dashboard','Dashboard',alerts().length,'red'],['pipeline','Pipeline',newLeads,''],['contacts','Contacts'],['tasks','Tasks',late,'red'],['jobs','Jobs',S.jobs.filter(j=>j.status==='active'&&j.pkg!=='monthly').length,''],['monthly','Monthly',S.jobs.filter(j=>j.pkg==='monthly'&&j.status==='active').length,''],['templates','Templates'],['playbook','Playbook'],['settings','Settings']];
  document.getElementById('side').innerHTML=`<a class="brand" href="#/dashboard"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#16324c"/><path d="M8 22 L22 8 M14 8 h8 v8" stroke="#c9843a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Takeoff<span style="color:#c9843a">SEO</span>&nbsp;<span style="font-family:var(--sans);font-weight:500;font-size:.8rem;color:#9a8f7c">admin</span></a>${nav.map(n=>`<a class="nav ${view===n[0]||(view==='contact'&&n[0]==='contacts')||(view==='check'&&n[0]==='contacts')||(view==='job'&&n[0]==='jobs')||(view==='new'&&n[0]==='pipeline')?'active':''}" href="#/${n[0]}">${n[1]}${n[2]?`<span class="cnt ${n[3]}">${n[2]}</span>`:''}</a>`).join('')}<div class="foot">${esc(S.settings.owner)}<br>${esc(S.settings.email)}<br>Preview · saves in this browser</div>`;
  const mn=document.getElementById('mobileNav');mn.innerHTML=nav.map(n=>`<option value="${n[0]}" ${view===n[0]?'selected':''}>${n[1]}${n[2]?' ('+n[2]+')':''}</option>`).join('');
  window.scrollTo(0,0);
}
S = load();
document.getElementById('mobileNav').addEventListener('change',e=>go('#/'+e.target.value));
window.addEventListener('hashchange',render);
function doTask(id){const t=S.tasks.find(x=>x.id===id);if(!t||t.done)return;completeTask(t);render();toast('Done')}
function manualStage(cid,stage){const c=contact(cid);setStage(c,stage,'moved by hand');save();render()}
function createLead(e){e.preventDefault();const f=new FormData(e.target);const d=Object.fromEntries(f.entries());const c=newLead(d);toast('Lead created');go('#/contact/'+c.id);return false}
function simulateForm(){
  const picks=[{name:'Jordan Test',business:'Test Roofing (sample)',email:'jordan@example.com',phone:'0400 000 099',area:'Coomera',jobs:'Roof restorations',website:'https://example.com',source:'Website: free check'},{name:'Casey Trial',business:'Trial Dental (sample)',email:'casey@example.com',phone:'',area:'Broadbeach',jobs:'New patients for check-ups',website:'https://example.org',source:'Website: package form',pkg:'tune'}];
  const p=picks[Math.floor(Math.random()*picks.length)];const c=newLead(p,{sample:true});render();toast(`Website form → lead created, T1 auto-reply logged, task set for ${fmtD(addBiz(today(),2))}`);
}
function sendCheck(id){const k=chk(id);const c=contact(k.cid);if(!k.fixes.some(f=>f)||!k.rec){if(!confirm('The fixes or recommendation are empty. Send anyway?'))return}k.sentAt=today();c.rec=k.rec==='none'?'':k.rec;markCheckSent(c);render();toast('Marked sent. Follow-up task set for +7 days.')}
function cyNum(jid,k,v){const j=S.jobs.find(x=>x.id===jid);const cy=j.cycles.find(x=>x.month===monthKey(today()));cy.numbers[k]=v;save();const c=contact(j.cid);const el=document.getElementById('repOut');if(el)el.textContent=monthlyReport(c,j,cy)}
function sendReport(jid){const j=S.jobs.find(x=>x.id===jid);const cy=j.cycles.find(x=>x.month===monthKey(today()));cy.reportSent=today();cy.items.forEach(i=>{if(i.t.includes('report sent'))i.done=true});act(j.cid,`Monthly report T12 sent · ${cy.month}`,'email');save();render();toast('Report marked sent')}
function changeFinish(jid,v){const j=S.jobs.find(x=>x.id===jid);const old=j.finish;j.finish=v;act(j.cid,`Finish date moved ${fmtD(old)} → ${fmtD(v)}. Tell the client in the Friday update (SOP-19).`,'system');save();render();toast('Finish date changed. Tell the client.')}
function fridayUpdate(jid){const j=S.jobs.find(x=>x.id===jid);const c=contact(j.cid);const done=j.pkg==='monthly'?(j.cycles.slice(-1)[0]?.items.filter(i=>i.done).map(i=>i.t).slice(-3).join('; ')||'[items]'):j.items.filter(i=>i.done).map(i=>i.t).slice(-3).join('; ')||'[items]';const next=j.pkg==='monthly'?(j.cycles.slice(-1)[0]?.items.filter(i=>!i.done).map(i=>i.t).slice(0,2).join('; ')||'[items]'):j.items.filter(i=>!i.done).map(i=>i.t).slice(0,2).join('; ')||'[items]';
  const body=`Subject: ${c.business}: this week\n\nHi ${first(c)},\n\nDone this week: ${done}\nNext week: ${next}\nNeed from you: nothing\nFinish date: ${j.finish?fmtD(j.finish)+', on track':'month to month'}\n\nAlex`;
  openDlg(`<h3>Friday update (T8) · ${esc(c.business)}</h3><pre class="email" id="friOut">${esc(body)}</pre><p class="hint">Four lines. If the finish date is at risk, say it here, not the week it's due.</p><div class="row sp"><button class="btn sec" onclick="closeDlg()">Close</button><div class="row"><button class="btn sec" onclick="copyText('friOut')">Copy</button><button class="btn" onclick="S.jobs.find(x=>x.id==='${jid}').fridays.push(today());act('${c.id}','Friday update T8 sent','email');save();closeDlg();render();toast('Logged')">Mark sent</button></div></div>`)}
function bookDlg(cid){const c=contact(cid);openDlg(`<h3>Book a package · ${esc(c.business)}</h3><p class="small muted">Creates the job and checklist, the invoice(s), and a finish date from your capacity (SOP-15). Logs the T6 email.</p><div class="f"><label>Package</label><select id="bkPkg" onchange="document.getElementById('bkPlan').style.display=this.value==='monthly'?'block':'none'">${Object.entries(PKG).map(([k,p])=>`<option value="${k}" ${c.rec===k?'selected':''}>${p.name} · ${k==='monthly'?'$690 / $1,190 a month':money(p.price)} · finish ~${k==='monthly'?'month to month':fmtD(finishDateFor(k))}</option>`).join('')}</select></div><div class="f" id="bkPlan" style="display:${c.rec==='monthly'?'block':'none'}"><label>Plan</label><select id="bkPlanV"><option value="steady">Steady $690</option><option value="growth">Growth $1,190</option></select></div><div class="row sp"><button class="btn sec" onclick="closeDlg()">Cancel</button><button class="btn" onclick="const j=bookPackage(contact('${cid}'),document.getElementById('bkPkg').value,document.getElementById('bkPlanV').value);closeDlg();go('#/job/'+j.id);toast('Booked. T6 + invoice logged.')">Book</button></div>`)}
function noteDlg(cid){openDlg(`<h3>Log call or note</h3><div class="f"><textarea id="noteTxt" placeholder="Called. Wants to start after school holidays. Check back 14 Oct."></textarea></div><div class="f"><label>Set a follow-up task? <span class="muted">(optional)</span></label><input type="date" id="noteDue"></div><div class="row sp"><button class="btn sec" onclick="closeDlg()">Cancel</button><button class="btn" onclick="const t=document.getElementById('noteTxt').value.trim();if(t){act('${cid}',t,'note');}const d=document.getElementById('noteDue').value;if(d)task('${cid}','Follow up: '+(t.slice(0,40)||'as agreed'),d,'task');save();closeDlg();render();toast('Logged')">Save</button></div>`)}
function taskDlg(cid){openDlg(`<h3>New task</h3><div class="f"><label>What</label><input id="tkT"></div><div class="f"><label>Due</label><input type="date" id="tkD" value="${addBiz(today(),1)}"></div><div class="row sp"><button class="btn sec" onclick="closeDlg()">Cancel</button><button class="btn" onclick="const t=document.getElementById('tkT').value.trim();if(!t)return;task('${cid}',t,document.getElementById('tkD').value,'task');save();closeDlg();render()">Add</button></div>`)}
function lostDlg(cid){openDlg(`<h3>Mark lost / not a fit</h3><div class="f"><label>Reason (honest, one line)</label><select id="lostR"><option>Not a fit: online shop / national</option><option>Not a fit: wants ads or social</option><option>Outside area</option><option>Chose someone else</option><option>Price</option><option>No reply after three touches</option><option>Other</option></select></div><p class="small muted">Sends T15 if not a fit. Thank them. Never argue.</p><div class="row sp"><button class="btn sec" onclick="closeDlg()">Cancel</button><button class="btn danger" onclick="const c=contact('${cid}');c.lostReason=document.getElementById('lostR').value;setStage(c,'lost',c.lostReason);if(c.lostReason.startsWith('Not a fit'))act(c.id,'Not-a-fit email T15 sent','email');S.tasks.filter(t=>t.cid===c.id&&!t.done).forEach(t=>{t.done=true;t.doneAt=today()});save();closeDlg();render()">Mark lost</button></div>`)}
function drag(e,id){e.dataTransfer.setData('text',id)}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over')}
function drop(e,stage){e.preventDefault();e.currentTarget.classList.remove('over');const id=e.dataTransfer.getData('text');const c=contact(id);if(!c)return;if(stage==='booked'&&!S.jobs.some(j=>j.cid===id)){bookDlg(id);return}if(stage==='lost'){lostDlg(id);return}setStage(c,stage,'dragged on the board');if(stage==='check'&&!S.tasks.some(t=>t.cid===id&&!t.done&&t.type==='follow'))task(id,'Follow up: did the check make sense? (T3)',addDays(today(),7),'follow');save();render()}
function copyText(id){const el=document.getElementById(id);navigator.clipboard?.writeText(el.textContent).then(()=>toast('Copied'),()=>toast('Select and copy manually'))}
function exportJSON(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S,null,2));a.download=`takeoffseo-admin-${today()}.json`;a.click()}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.contacts)throw 0;S=s;save();render();toast('Imported')}catch(e){toast('That file didn\'t look right')}};r.readAsText(f)}
function clearSample(){const ids=new Set(S.contacts.filter(c=>c.sample).map(c=>c.id));S.contacts=S.contacts.filter(c=>!ids.has(c.id));S.tasks=S.tasks.filter(t=>!ids.has(t.cid));S.activities=S.activities.filter(a=>!ids.has(a.cid));S.jobs=S.jobs.filter(j=>!ids.has(j.cid));S.checks=S.checks.filter(k=>!ids.has(k.cid));save()}
render();
</script>
